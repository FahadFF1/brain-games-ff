<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#F7F4EE">
<title>تمرين المخ اليومي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2EFE8;--card:#fff;--ink:#1D2A38;--muted:#6E7A89;--line:#E6E1D6;--acc:#0E7C6E;--acc2:#2E6F9E;--good:#1F9D5C;--bad:#E5484D;--r:22px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Readex Pro',system-ui,sans-serif}
body{display:flex;justify-content:center}
#app{width:100%;max-width:480px;min-height:100vh;padding-bottom:100px}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
svg{display:block}
.h1,.card h3,.intro h2,.result .score,.age,.ask,.q,.brand{font-family:'Cairo',sans-serif;letter-spacing:-.3px}
.brand{display:flex;align-items:center;gap:7px;font-weight:900;font-size:19px;margin-inline-end:auto;color:var(--ink)}
.brand svg{width:24px;height:24px}
.top{display:flex;align-items:center;gap:10px;padding:18px 16px 4px}
.pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:800;font-size:15px;display:flex;gap:5px;align-items:center}
.pill small{font-size:11px;color:var(--muted);font-weight:700}
.pill svg{width:17px;height:17px}
.h1{font-size:30px;font-weight:900;margin:14px 18px 2px}
.sub{color:var(--muted);margin:0 18px 8px;font-size:15px}
.card{background:var(--card);border-radius:var(--r);margin:14px 16px;padding:20px;border:1px solid var(--line);box-shadow:0 1px 2px rgba(0,0,0,.03)}
.card h3{margin:0 0 6px;font-size:20px;font-weight:800}
.card p{margin:0 0 14px;color:var(--muted);line-height:1.6}
.hero{background:#15323B;color:#fff;border:0}
.hero p{color:#C9D5E3}
.btn{background:var(--acc);color:#fff;font-weight:700;font-size:20px;border-radius:16px;padding:15px 20px;width:100%;transition:transform .1s;box-shadow:0 4px 0 #0A5C51}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.sec{background:#EEE8DE;color:var(--ink);box-shadow:0 4px 0 #DCD4C6}
.ring{width:150px;height:150px;margin:4px auto 12px;position:relative}
.ring svg.r{position:absolute;inset:0}
.ring .c{position:absolute;inset:20px;border-radius:50%;background:linear-gradient(135deg,#2BA393,#0E7C6E);display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff}
.ring .c b{font-size:46px;line-height:1;font-weight:900}
.ring .c span{font-size:12px;font-weight:700;opacity:.92}
.center{text-align:center}
.glist{display:flex;flex-direction:column;gap:14px;margin-top:8px}
.grow{display:flex;align-items:center;gap:13px;background:#fff;width:100%;text-align:right;padding:13px 15px;border-radius:16px;border:1px solid var(--line);box-shadow:0 1px 2px rgba(0,0,0,.03);transition:transform .1s}
.grow:active{transform:scale(.99)}
.hero .grow{color:var(--ink);background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.2);padding:12px 14px}
.hero .grow small{color:var(--muted)}
.grow b{display:block;font-size:17px;font-weight:600}
.grow small{color:var(--muted);font-weight:500;font-size:12.5px}
.grow .best{margin-inline-start:auto;font-weight:700;color:var(--acc2);font-size:18px;text-align:left;line-height:1.1}
.grow .best small{font-size:11px}
.badge{border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.gtiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gtile{background:#fff;border-radius:20px;padding:16px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 3px 14px rgba(0,0,0,.05);text-align:center}
.gtile b{font-size:16px}
.gtile small{color:var(--muted);font-weight:700;font-size:12px}
.gtile .sc{font-weight:900;color:var(--acc2);font-size:13px;min-height:16px}
.week{display:flex;justify-content:space-between;margin-top:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:700}
.stamp{width:38px;height:38px;border-radius:50%;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center}
.stamp.on{border:0;background:var(--acc);transform:rotate(-12deg);box-shadow:0 3px 0 #0A5C51}
.stamp.today{border-color:var(--acc)}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--line);display:flex;padding:10px 0 calc(10px + env(safe-area-inset-bottom));z-index:5}
.nav button{flex:1;background:none;color:#9AA1AC;font-size:13px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button.on{color:var(--acc)}
.cat{font-size:14px;font-weight:900;color:var(--muted);margin:22px 20px 10px;display:flex;align-items:center;gap:8px}
.cat:before{content:'';width:8px;height:8px;border-radius:50%;background:var(--acc)}
.gwrap{margin:0 16px}
/* game */
.game{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;align-items:center}
.ghead{width:100%;max-width:480px;display:flex;align-items:center;gap:10px;padding:14px 16px}
.ghead .x{width:42px;height:42px;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.06);display:flex;align-items:center;justify-content:center}
.ghead .gt{font-weight:800;font-size:18px;flex:1}
.ginfo{font-weight:900;font-size:20px;min-width:70px;text-align:left;direction:ltr;font-variant-numeric:tabular-nums}
.gbody{width:100%;max-width:480px;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:safe center;overflow-y:auto;padding:0 16px 20px;position:relative}
.intro{text-align:center;padding:10px}
.intro .badge{margin:0 auto 18px}
.intro h2{font-size:28px;margin:0 0 8px;font-weight:900}
.intro p{color:var(--muted);font-size:17px;line-height:1.7;margin:0 0 26px}
.cd{font-size:120px;font-weight:900;color:var(--acc);animation:pop .7s ease}
@keyframes pop{0%{transform:scale(.4);opacity:0}40%{transform:scale(1.1);opacity:1}100%{transform:scale(1)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:340px;direction:ltr}
.pad button{background:#fff;border-radius:16px;font-size:28px;font-weight:800;padding:14px 0;box-shadow:0 3px 0 var(--line);display:flex;align-items:center;justify-content:center}
.pad button:active{background:#F1ECE3;transform:translateY(2px);box-shadow:none}
.pad .ok{background:var(--acc);color:#fff;font-size:18px;box-shadow:0 3px 0 #0A5C51}
.pad .blank{visibility:hidden}
.q{font-size:52px;font-weight:900;direction:ltr;margin:8px 0}
.ansbox{font-size:44px;font-weight:900;direction:ltr;min-width:120px;min-height:64px;text-align:center;border-bottom:4px solid var(--line);margin-bottom:22px;color:var(--acc2)}
.prog{color:var(--muted);font-weight:800}
.mark{position:absolute;top:6px;left:50%;margin-left:-34px;pointer-events:none;animation:markf .5s forwards;z-index:9}
@keyframes markf{0%{opacity:1;transform:scale(.5)}55%{opacity:1;transform:scale(1.1)}100%{opacity:0;transform:scale(1)}}
.stage{width:100%;height:340px;background:linear-gradient(#EAF6FD,#fff);border-radius:24px;position:relative;overflow:hidden;direction:ltr;box-shadow:inset 0 0 0 2px var(--line)}
.stage.plain{background:#fff}
.fly{position:absolute;left:0;top:0;will-change:transform}
.walk svg{animation:bob .32s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-4px)}}
.house{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);z-index:3;filter:drop-shadow(0 8px 10px rgba(0,0,0,.15))}
.ground{position:absolute;bottom:0;left:0;right:0;height:40px;background:#BFE3B4}
.cloud{position:absolute;opacity:.9}
.word{font-size:72px;font-weight:900;margin:10px 0 40px}
.cbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:360px}
.cbtns button{background:#fff;border-radius:18px;padding:22px 0;font-size:26px;font-weight:800;box-shadow:0 4px 0 var(--line)}
.cbtns button:active{transform:translateY(3px);box-shadow:none}
.grid{display:grid;gap:8px;width:min(330px,88vw);aspect-ratio:1;direction:ltr}
.tile{background:#fff;border-radius:12px;box-shadow:0 3px 0 var(--line);transition:background .15s;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:26px}
.tile.lit{background:var(--acc2);color:#fff}
.tile.badt{background:var(--bad)}
.tile.miss{background:#A7E3DA}
.tile.empty{background:transparent;box-shadow:none}
.tile.hid{background:#2E4A63}
.cmp{display:flex;flex-direction:column;gap:14px;width:100%;max-width:360px}
.cmp button{background:#2F5D4E;color:#fff;border-radius:20px;padding:30px 10px;font-size:40px;font-weight:900;direction:ltr;box-shadow:0 5px 0 #1E3E33;border:4px solid #3F7564}
.cmp button.eq{background:#fff;color:var(--ink);font-size:20px;padding:14px;box-shadow:0 4px 0 var(--line);direction:rtl;border:0}
.cmp button:active{transform:translateY(3px);box-shadow:none}
.ask{font-size:24px;font-weight:800;margin:6px 0 12px;text-align:center}
.result{text-align:center;width:100%}
.result .score{font-size:90px;font-weight:900;color:var(--acc);line-height:1}
.result .lbl{color:var(--muted);font-weight:800;margin-bottom:14px}
.result .stat{background:#fff;border-radius:16px;padding:14px;font-weight:800;font-size:18px;margin:12px 0 22px}
.result .badge{margin:0 auto 12px}
.newbest{display:inline-flex;gap:6px;align-items:center;background:#FFF1C2;color:#8A6200;padding:6px 14px;border-radius:999px;font-weight:900;margin-bottom:10px}
.age{font-size:120px;font-weight:900;color:var(--acc);line-height:1}
.btnrow{display:flex;flex-direction:column;gap:12px;width:100%}
.bar{height:10px;background:#EEE8DE;border-radius:9px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--acc2);border-radius:9px}
svg text{font-family:'Readex Pro',sans-serif}
.dots{display:flex;gap:6px;justify-content:center;margin:14px 0 8px;flex-wrap:wrap}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--acc)}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:360px;margin-top:28px}
.yn button{border-radius:20px;padding:22px 0;font-size:26px;font-weight:900;color:#fff}
.yn .no{background:var(--bad);box-shadow:0 5px 0 #B9363A}
.yn .yes{background:var(--good);box-shadow:0 5px 0 #157346}
.yn button:active{transform:translateY(3px);box-shadow:none}
.shapecard{width:200px;height:200px;background:#fff;border-radius:28px;box-shadow:0 6px 0 var(--line);display:flex;align-items:center;justify-content:center}
.shapecard.in{animation:cardin .2s ease}
@keyframes cardin{from{transform:translateX(-40px);opacity:0}to{transform:none;opacity:1}}
.words{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:380px}
.words div,.words button{background:#fff;border-radius:14px;padding:14px 8px;font-size:22px;font-weight:800;text-align:center;box-shadow:0 3px 0 var(--line)}
.words button.sel{background:var(--acc2);color:#fff}
.words button.hit{background:var(--good);color:#fff}
.words button.fa{background:var(--bad);color:#fff}
.words button.missed{background:#FFF1C2}
.dotn{position:absolute;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:#fff;box-shadow:0 3px 0 var(--line),0 0 0 2px var(--line) inset;font-weight:900;font-size:20px;display:flex;align-items:center;justify-content:center;z-index:2}
.dotn.done{background:var(--acc2);color:#fff;box-shadow:none}
.dotn.err{background:var(--bad);color:#fff}
.simon{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:min(320px,84vw);aspect-ratio:1;direction:ltr}
.simon button{border-radius:28px;opacity:.38;transition:opacity .1s,transform .1s}
.simon button.on{opacity:1;transform:scale(1.04)}
.simon button:nth-child(1){border-top-left-radius:120px}
.simon button:nth-child(2){border-top-right-radius:120px}
.simon button:nth-child(3){border-bottom-left-radius:120px}
.simon button:nth-child(4){border-bottom-right-radius:120px}
.bird{position:absolute;left:0;top:0;transform-origin:50% 50%;will-change:transform}
.bird .wf{transform-box:fill-box;transform-origin:50% 100%;animation:flap .14s ease-in-out infinite alternate}
.bird .wb{transform-box:fill-box;transform-origin:85% 100%;animation:flap .14s ease-in-out infinite alternate-reverse}
.bird.hov .wf,.bird.hov .wb{animation-duration:.22s}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(-.5)}}
.bx{animation:drop .2s ease-out both}
.cubes.noanim .bx{animation:none}
.cdov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:110px;font-weight:900;color:var(--acc);z-index:5;pointer-events:none}
.cdov.pp{animation:pop .6s ease}
@keyframes drop{from{transform:translateY(-30px);opacity:0}to{transform:none;opacity:1}}
.counter{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:18px;direction:ltr}
.counter .num{font-size:64px;font-weight:900;min-width:96px;text-align:center;background:#fff;border-radius:18px;box-shadow:0 4px 0 var(--line);font-variant-numeric:tabular-nums}
.counter button{width:84px;height:84px;border-radius:50%;font-size:30px;font-weight:900;background:var(--acc2);color:#fff;box-shadow:0 5px 0 #13786D}
.counter .minus{width:60px;height:60px;font-size:30px;background:#EEE8DE;color:var(--ink);box-shadow:0 4px 0 #DCD4C6}
.counter button:active{transform:translateY(3px);box-shadow:none}
.cubes .ft{fill:#fff}.cubes .fl2{fill:#D6D6D6}.cubes .fr{fill:#8A8A8A}
.cubes.green .ft{fill:#8DEB76}.cubes.green .fl2{fill:#4FCB3B}.cubes.green .fr{fill:#2F9E24}
.cubes.green polygon{transition:fill .3s}
.reveal{display:flex;flex-direction:column;align-items:center;margin-top:16px}
.reveal span{font-size:56px;font-weight:900;line-height:1}.reveal .g{color:var(--good)}.reveal .b{color:var(--bad)}
.reveal small{color:var(--muted);font-weight:800}
.tbar{position:relative;width:100%;max-width:420px;height:26px;background:#E7E2D9;border-radius:999px;overflow:hidden;margin-bottom:10px}
.tbar i{position:absolute;inset:0 auto 0 0;width:100%;background:var(--acc);border-radius:999px}
.tbar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;direction:ltr;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.lvl{background:#17202B;color:#fff;font-weight:800;font-size:14px;padding:4px 14px;border-radius:999px;margin-bottom:6px}
.lvlp{font-size:12px;font-weight:800;background:#17202B;color:#fff;padding:2px 9px;border-radius:999px;vertical-align:middle;margin-inline-start:4px}
.stage.small{width:72%;margin:0 auto}
.pad.compact button{padding:9px 0;font-size:24px}
@media(min-width:720px){
  #app{max-width:720px}
  .nav{max-width:720px}
  .glist{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .gwrap{margin:0 24px}
  .h1{margin:18px 24px 2px}.sub{margin:0 24px 10px}.cat{margin:24px 26px 10px}
  .card{margin:16px 24px}
}
</style>
</head>
<body>
<div id="app"></div>
<nav class="nav"></nav>
<script>
/* ================= ART (inline SVG) ================= */
const sv=(vb,w,inner,h)=>`<svg viewBox="${vb}" width="${w}" height="${h||w}" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
const ART={
  /* game glyphs, 64x64, drawn in white on a coloured badge */
  calc:`<rect x="15" y="10" width="34" height="44" rx="7" fill="#fff"/><rect x="20" y="15" width="24" height="9" rx="3" fill="#FCD9C8"/><g fill="#E8673A"><circle cx="24" cy="32" r="3"/><circle cx="32" cy="32" r="3"/><circle cx="40" cy="32" r="3"/><circle cx="24" cy="41" r="3"/><circle cx="32" cy="41" r="3"/><circle cx="24" cy="49" r="0"/></g><rect x="37" y="38" width="6" height="12" rx="3" fill="#E8673A"/><rect x="21" y="45" width="14" height="5" rx="2.5" fill="#E8673A"/>`,
  flyby:`<path d="M12 38l-7-8 2 12z" fill="#fff"/><ellipse cx="29" cy="38" rx="17" ry="11" fill="#fff"/><path d="M24 36 38 13 45 35z" fill="#CDEFFF"/><circle cx="43" cy="33" r="8" fill="#fff"/><path d="M50 32l8 2.5-8 2.5z" fill="#F6B04A"/><circle cx="45" cy="31" r="1.8" fill="#17202B"/>`,
  stroop:`<circle cx="25" cy="26" r="13" fill="#FF6B6E"/><circle cx="39" cy="26" r="13" fill="#5B8CFF" opacity=".92"/><circle cx="32" cy="39" r="13" fill="#FFD24A" opacity=".92"/>`,
  matrix:`<g fill="#fff"><rect x="11" y="11" width="12" height="12" rx="3"/><rect x="26" y="11" width="12" height="12" rx="3" opacity=".35"/><rect x="41" y="11" width="12" height="12" rx="3" opacity=".35"/><rect x="11" y="26" width="12" height="12" rx="3" opacity=".35"/><rect x="26" y="26" width="12" height="12" rx="3"/><rect x="41" y="26" width="12" height="12" rx="3"/><rect x="11" y="41" width="12" height="12" rx="3" opacity=".35"/><rect x="26" y="41" width="12" height="12" rx="3" opacity=".35"/><rect x="41" y="41" width="12" height="12" rx="3"/></g>`,
  compare:`<rect x="8" y="14" width="48" height="34" rx="5" fill="#2F5D4E" stroke="#fff" stroke-width="3"/><path d="M27 23l12 8-12 8" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="22" y="50" width="20" height="4" rx="2" fill="#fff"/>`,
  house:`<path d="M15 31 32 16l17 15v20H15z" fill="#fff"/><path d="M10 33 32 13l22 20" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="28" y="37" width="9" height="14" rx="2" fill="#F39A2D"/><rect x="19" y="34" width="6" height="6" rx="1" fill="#9AD3F5"/>`,
  speed:`<rect x="13" y="12" width="30" height="40" rx="6" fill="#fff" opacity=".45" transform="rotate(-10 28 32)"/><rect x="21" y="12" width="30" height="40" rx="6" fill="#fff"/><path d="M38 17 27 34h8l-3 13 11-18h-8z" fill="#7C5CFA"/>`,
  words:`<path d="M10 18c8-4 15-4 22 2v30c-7-6-14-6-22-2z" fill="#fff"/><path d="M54 18c-8-4-15-4-22 2v30c7-6 14-6 22-2z" fill="#fff" opacity=".82"/><path d="M15 26h11M15 32h11M15 38h8M38 26h11M38 32h11" stroke="#E9A23B" stroke-width="2.5" stroke-linecap="round"/>`,
  trail:`<path d="M17 45 30 21l17 13" stroke="#fff" stroke-width="3.5" fill="none" stroke-dasharray="5 5" stroke-linecap="round"/><circle cx="17" cy="45" r="8" fill="#fff"/><circle cx="30" cy="21" r="8" fill="#fff"/><circle cx="47" cy="34" r="8" fill="#fff"/><text x="17" y="49.5" font-size="12" font-weight="900" text-anchor="middle" fill="#0E8C7E">1</text><text x="30" y="25.5" font-size="12" font-weight="900" text-anchor="middle" fill="#0E8C7E">2</text><text x="47" y="38.5" font-size="12" font-weight="900" text-anchor="middle" fill="#0E8C7E">3</text>`,
  simon:`<path d="M30 30H12a18 18 0 0 1 18-18z" fill="#FF6B6E"/><path d="M34 30V12a18 18 0 0 1 18 18z" fill="#5B8CFF"/><path d="M30 34v18a18 18 0 0 1-18-18z" fill="#FFD24A"/><path d="M34 34h18a18 18 0 0 1-18 18z" fill="#fff"/>`,
  boxes:`<g stroke="#1A1A1A" stroke-width="1.2" stroke-linejoin="round"><path d="M32 30 46 38 32 46 18 38z" fill="#fff"/><path d="M18 38v10l14 8V46z" fill="#D6D6D6"/><path d="M46 38v10l-14 8V46z" fill="#8A8A8A"/><path d="M32 14 46 22 32 30 18 22z" fill="#fff"/><path d="M18 22v8l14 8v-8z" fill="#D6D6D6"/><path d="M46 22v8l-14 8v-8z" fill="#8A8A8A"/></g>`,

const $=s=>document.querySelector(s);
const ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pad2=n=>String(n).padStart(2,'0');
function dayKey(off=0){const d=new Date();d.setDate(d.getDate()+off);return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())}

const KEY='brain_trainer_v1';
let S={days:{},best:{},hist:{},ages:[]};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function streak(){let n=0,o=S.days[dayKey(0)]?0:-1;while(S.days[dayKey(o)]){n++;o--}return n}
function record(id,res){
  const d=dayKey();S.days[d]=S.days[d]||{played:[]};
  if(!S.days[d].played.includes(id))S.days[d].played.push(id);
  const b=S.best[id];const isBest=!b||res.norm>b.norm;
  if(isBest)S.best[id]={norm:res.norm,stat:res.stat};
  (S.hist[id]=S.hist[id]||[]).push({d,n:res.norm});
  if(S.hist[id].length>60)S.hist[id].shift();
  save();return isBest&&!!b;
}

const lvl=id=>clamp((S.lvl&&S.lvl[id])||1,1,10);
function levelUp(id,norm){const L=lvl(id),nl=clamp(L+(norm>=80?1:norm<50?-1:0),1,10);S.lvl=S.lvl||{};S.lvl[id]=nl;save();
  return nl>L?`مستوى جديد! ${L} ← ${nl}`:nl<L?`نزلت للمستوى ${nl}`:`باقي على المستوى ${L}`}

let AC=null;
function tone(f,d=.18,type='triangle',vol=.12){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d+.02)}catch(e){}}
const snd=ok=>ok?tone(880):tone(180,.18,'square',.05);

/* ================= game runner ================= */
function badge(g,size){return `<div class="badge" style="width:${size}px;height:${size}px;background:linear-gradient(145deg,${g.c1},${g.c2})">${sv('0 0 64 64',Math.round(size*.62),ART[g.id])}</div>`}
function runGame(game,onFinish,label){
  const el=document.createElement('div');el.className='game';
  const L=lvl(game.id);
  el.innerHTML=`<div class="ghead"><button class="x">${UI.close}</button><div class="gt">${label||game.name} <span class="lvlp">مستوى ${L}</span></div><div class="ginfo"></div></div><div class="gbody"></div>`;
  document.body.appendChild(el);
  let alive=true;const timers=[];
  const body=el.querySelector('.gbody');
  const ctx={
    body,game,L,
    info:t=>{el.querySelector('.ginfo').textContent=t},
    after:(ms,f)=>{const id=setTimeout(()=>alive&&f(),ms);timers.push(id);return id},
    every:(ms,f)=>{const id=setInterval(()=>alive&&f(),ms);timers.push(id);return id},
    stop:id=>{clearTimeout(id);clearInterval(id)},
    mark:ok=>{snd(ok);const m=document.createElement('div');m.className='mark';m.innerHTML=ok?UI.ok:UI.bad;body.appendChild(m);setTimeout(()=>m.remove(),520)},
    done:res=>{if(!alive)return;cleanup();onFinish&&onFinish(res)}
  };
  function cleanup(){alive=false;timers.forEach(t=>{clearTimeout(t);clearInterval(t)});el.remove()}
  el.querySelector('.x').onclick=()=>{cleanup();onFinish&&onFinish(null)};
  body.innerHTML=`<div class="intro">${badge(game,120)}<h2>${game.name}</h2><div class="lvl" style="display:inline-block">المستوى ${L}</div><p>${game.how}</p><button class="btn">ابدأ</button></div>`;
  body.querySelector('.btn').onclick=()=>{tone(660);if(game.selfCD){body.innerHTML='';game.play(ctx)}else countdown(ctx,()=>{body.innerHTML='';game.play(ctx)})};
}
function countdown(ctx,go){let n=3;const step=()=>{if(n===0)return go();ctx.body.innerHTML=`<div class="cd">${n}</div>`;tone(520,.12);n--;ctx.after(720,step)};step()}
function keypad(onKey,okLabel){
  const k=document.createElement('div');k.className='pad';
  ['7','8','9','4','5','6','1','2','3','⌫','0',okLabel||''].forEach(t=>{
    const b=document.createElement('button');
    b.innerHTML=t==='⌫'?sv('0 0 24 24',26,'<path d="M9 5h11v14H9l-6-7z" fill="none" stroke="#17202B" stroke-width="2.2" stroke-linejoin="round"/><path d="M12 9l5 6M17 9l-5 6" stroke="#17202B" stroke-width="2.2" stroke-linecap="round"/>'):t;
    if(t==='')b.className='blank';
    if(okLabel&&t===okLabel)b.className='ok';
    b.addEventListener('pointerdown',e=>{e.preventDefault();if(t)onKey(t)});
    k.appendChild(b);
  });
  return k;
}
function askNumber(ctx,question,onAnswer){
  let cur='';
  ctx.body.innerHTML=`<div class="ask">${question}</div><div class="ansbox">?</div>`;
  const box=ctx.body.querySelector('.ansbox');
  ctx.body.appendChild(keypad(k=>{
    if(k==='⌫')cur=cur.slice(0,-1);
    else if(k==='تأكيد'){if(cur!=='')onAnswer(parseInt(cur,10));return}
    else if(cur.length<2)cur+=k;
    box.textContent=cur||'?';
  },'تأكيد'));
}
const tap=(el,f)=>el.addEventListener('pointerdown',e=>{e.preventDefault();f(e)});

GAMES.push({id:'calc',name:'الحساب السريع',cat:'الحساب',c1:'#FF9A6B',c2:'#E8673A',
  how:'٢٠ مسألة بسيطة. اكتب الجواب بأسرع ما تقدر، وينتقل تلقائيًا بعد ما تكمل الرقم.',
  play(ctx){
    const P=[];for(let i=0;i<20;i++){const t=ri(0,2);let a,b,op,ans;
      const L=ctx.L,M=9+2*(L-1);const t2=L>=6&&Math.random()<.25?3:t;
      if(t2===0){a=ri(1,M);b=ri(1,M);op='+';ans=a+b}
      else if(t2===1){a=ri(3,18+3*(L-1));b=ri(1,Math.min(M,a));op='−';ans=a-b}
      else if(t2===2){a=ri(2,9);b=ri(2,9+Math.floor((L-1)/3));op='×';ans=a*b}
      else{b=ri(2,9);ans=ri(2,9);a=b*ans;op='÷'}
      P.push({q:`${a} ${op} ${b}`,ans:String(ans)})}
    let i=0,cur='',ok=0;const t0=performance.now();
    ctx.body.innerHTML=`<div class="prog"></div><div class="q"></div><div class="ansbox">?</div>`;
    const q=ctx.body.querySelector('.q'),box=ctx.body.querySelector('.ansbox'),pr=ctx.body.querySelector('.prog');
    const show=()=>{q.textContent=P[i].q+' =';box.textContent='?';pr.textContent=`${i+1} / 20`};
    show();
    ctx.every(100,()=>ctx.info(((performance.now()-t0)/1000).toFixed(1)+'s'));
    ctx.body.appendChild(keypad(k=>{
      if(k==='⌫'){cur=cur.slice(0,-1);box.textContent=cur||'?';return}
      cur+=k;box.textContent=cur;
      if(cur.length>=P[i].ans.length){
        const good=cur===P[i].ans;if(good)ok++;ctx.mark(good);i++;cur='';
        if(i===20){const t=(performance.now()-t0)/1000;const sp=clamp((80-t)/60,0,1);
          return ctx.done({norm:Math.round(100*(ok/20)*(.35+.65*sp)),stat:`${t.toFixed(1)} ثانية • ${ok}/20 صح`})}
        show();
      }
    }));
  }});

GAMES.push({id:'compare',name:'أيهم أكبر؟',cat:'الحساب',c1:'#5FB08E',c2:'#2F7A5E',
  how:'معادلتين قدامك. اضغط على اللي ناتجها أكبر، أو «متساويتين». تصعب كل ما تتقدم. ٤٥ ثانية.',
  play(ctx){
    const gen=L=>{const t=L===0?0:ri(1,Math.min(L,3));let s,v;
      if(t===0){v=ri(1,40);s=''+v}
      else if(t===1){const a=ri(2,25),b=ri(1,20);if(Math.random()<.5){s=`${a} + ${b}`;v=a+b}else{const x=Math.max(a,b),y=Math.min(a,b);s=`${x} − ${y}`;v=x-y}}
      else if(t===2){const a=ri(2,9),b=ri(2,12);if(Math.random()<.6){s=`${a} × ${b}`;v=a*b}else{const q=ri(2,9);s=`${a*q} ÷ ${a}`;v=q}}
      else{const a=ri(2,9),b=ri(2,9),c=ri(1,15);if(Math.random()<.5){s=`${a} × ${b} + ${c}`;v=a*b+c}else{s=`${a} × ${b} − ${c}`;v=a*b-c}}
      return{s,v}};
    let c=0,w=0,left=45,A,B;
    ctx.body.innerHTML=`<div class="cmp"><button data-k="a"></button><button data-k="b"></button><button class="eq" data-k="e">متساويتين =</button></div>`;
    const ba=ctx.body.querySelector('[data-k=a]'),bb=ctx.body.querySelector('[data-k=b]');
    const next=()=>{const L=Math.min(3,Math.floor(c/4)+Math.floor((ctx.L-1)/3));A=gen(L);const eq=Math.random()<.12;let tries=0;
      do{B=gen(L);tries++}while(tries<400&&(eq?B.v!==A.v:(B.v===A.v||Math.abs(B.v-A.v)>Math.max(3,A.v*(.35-.02*(ctx.L-1))))));
      if(tries>=400){const v=A.v+ri(1,3);B={s:String(v),v}}
      ba.textContent=A.s;bb.textContent=B.s};
    ctx.body.querySelectorAll('button').forEach(b=>tap(b,()=>{
      const k=b.dataset.k;const ok=k==='e'?A.v===B.v:k==='a'?A.v>B.v:B.v>A.v;ok?c++:w++;ctx.mark(ok);next()}));
    next();ctx.info(left+'s');
    ctx.every(1000,()=>{left--;ctx.info(left+'s');if(left<=0)ctx.done({norm:clamp(Math.round((c-w)/25*100),0,100),stat:`${c} صح • ${w} غلط`})});
  }});

GAMES.push({id:'matrix',name:'مصفوفة الذاكرة',cat:'الذاكرة',c1:'#3CCBB9',c2:'#159483',
  how:'تنوّر مربعات لثواني ثم تختفي. اضغط على نفس المربعات. كل ما ضبطت يزيد العدد. ١٠ محاولات.',

    const go=()=>{
      ctx.info(`${trial+1}/10`);
      const g=sizeFor(n),cells=g*g,target=new Set(shuffle([...Array(cells).keys()]).slice(0,n));

      target.forEach(i=>T[i].classList.add('lit'));
      let open=false,found=0,over=false;
      ctx.after((900+n*180)*(1-.04*(ctx.L-1)),()=>{target.forEach(i=>T[i].classList.remove('lit'));open=true});
      const end=()=>ctx.after(900,()=>{trial++;if(trial<10)go();else ctx.done({norm:clamp(Math.round(pts/(65+10*(ctx.L-1))*100),0,100),stat:`أعلى مستوى: ${maxN} مربعات`})});
      T.forEach((t,i)=>tap(t,()=>{
        if(!open||over||t.classList.contains('lit'))return;
        if(target.has(i)){t.classList.add('lit');found++;tone(600+found*40,.1);
          if(found===n){over=true;pts+=n;maxN=Math.max(maxN,n);ctx.mark(true);n=Math.min(14,n+1);end()}}
        else{over=true;t.classList.add('badt');ctx.mark(false);target.forEach(j=>{if(!T[j].classList.contains('lit'))T[j].classList.add('miss')});n=Math.max(3,n-1);end()}

        const tk=ctx.every(50,()=>{const left=Math.max(0,DUR-(performance.now()-t0));bar.style.width=(left/DUR*100)+'%';lab.textContent=(left/1000).toFixed(1);if(left<=0)ctx.stop(tk)})});
      ctx.after(land+DUR,()=>{ctx.body.querySelector('.tbar').style.display='none';if(dense)ctx.body.querySelector('.stage').classList.add('small');
        gx.style.transition='opacity .25s';gx.style.opacity='0';
        ctx.body.querySelector('#bq').textContent='كم صندوق كان فيه؟';
        const cnt=ctx.body.querySelector('#cnt');
        const finish=c=>{
          const ok=c===n;if(ok){pts++;correct++}else if(Math.abs(c-n)===1)pts+=.5;
          ctx.mark(ok);gx.getAnimations().forEach(an=>an.cancel());gx.classList.add('green');gx.style.opacity='1';
          cnt.innerHTML=`<div class="reveal"><span class="${ok?'g':'b'}">${c}</span><small>جوابك</small></div>`;
          ctx.body.querySelector('#bq').innerHTML=`كان فيه <b style="font-size:40px">${n}</b> صناديق`;
          ctx.after(2400,()=>{r++;if(r<5)round();else ctx.done({norm:Math.round(pts/5*100),stat:`${correct} من 5 جولات صح`})});
        };
        if(dense){
          /* big numbers: type the answer */
          let cur='';cnt.innerHTML='<div class="ansbox" style="margin:12px auto 12px">?</div>';const ab=cnt.querySelector('.ansbox');
          const kp=keypad(k=>{if(k==='⌫')cur=cur.slice(0,-1);else if(k==='تم'){if(cur!=='')finish(parseInt(cur,10));return}else if(cur.length<2)cur+=k;ab.textContent=cur||'?'},'تم');
          kp.style.margin='0 auto';kp.classList.add('compact');cnt.appendChild(kp);
        }else{
          let c=0;
          cnt.innerHTML=`<div class="counter"><button class="minus">−</button><div class="num">0</div><button class="plus">+1</button></div><div style="width:100%;max-width:340px;margin:14px auto 0"><button class="btn" id="bdone">تم</button></div>`;
          const num=cnt.querySelector('.num');
          tap(cnt.querySelector('.plus'),()=>{if(c<40){c++;num.textContent=c;tone(620+c*8,.06)}});
          tap(cnt.querySelector('.minus'),()=>{if(c>0){c--;num.textContent=c;tone(400,.06)}});
          cnt.querySelector('#bdone').onclick=()=>finish(c);
        }
      });
    };
    round();
  }});

GAMES.push({id:'house',name:'كم واحد في البيت؟',cat:'الانتباه',c1:'#FFB45E',c2:'#F08A2E',
  how:'ناس تدخل البيت وناس تطلع منه. تابعهم، وفي الأخير قل كم واحد باقي داخل البيت. ٣ جولات.',
  play(ctx){
    let r=0,correct=0;
    const round=()=>{
      ctx.info(`${r+1}/3`);
      ctx.body.innerHTML=`<div class="stage"><div class="cloud" style="left:8%;top:24px">${sv('0 0 56 34',80,ART.cloud,49)}</div><div class="ground"></div><div class="house">${sv('0 0 160 154',170,ART.houseBig,164)}</div></div>`;
      const st=ctx.body.querySelector('.stage');const W=st.clientWidth;const mid=W/2-15;
      let inside=0;const kL=1-.04*(ctx.L-1),dur=[1300,1050,850][r]*kL,gap=[1100,850,650][r]*kL,events=[6,9,12][r]+ctx.L-1;
      const walk=enter=>{const p=document.createElement('div');p.className='fly walk';const c=PEOPLE[ri(0,PEOPLE.length-1)];
        p.innerHTML=`<div style="transform:scaleX(${enter?1:-1})">${PERSON(...c)}</div>`;p.style.top='auto';p.style.bottom='28px';st.appendChild(p);
        const from=enter?W+10:mid,to=enter?mid:-50;
        p.animate([{transform:`translateX(${from}px)`},{transform:`translateX(${to}px)`}],{duration:dur,easing:'linear',fill:'forwards'}).onfinish=()=>p.remove()};
      const k0=ri(2,4);let t=300;
      for(let i=0;i<k0;i++){ctx.after(t,()=>walk(true));t+=380;inside++}
      t+=dur+300;
      for(let e=0;e<events;e++){
        const simul=(r>0||ctx.L>3)&&Math.random()<.32+.03*ctx.L?(ctx.L>=7&&Math.random()<.3?3:2):1;
        for(let s=0;s<simul;s++){const enter=inside===0||Math.random()<.5;enter?inside++:inside--;ctx.after(t+s*ri(120,320),()=>walk(enter))}
        t+=gap+ri(-150,150);
      }
      const ans=inside;
      ctx.after(t+dur+300,()=>askNumber(ctx,'كم واحد داخل البيت الحين؟',a=>{const ok=a===ans;if(ok)correct++;ctx.mark(ok);
        ctx.body.querySelector('.ask').textContent=ok?'صح!':`الجواب الصحيح: ${ans}`;
        ctx.after(1200,()=>{r++;if(r<3)round();else ctx.done({norm:Math.round(correct/3*100),stat:`${correct} من 3 جولات صح`})})}));
    };
    round();
  }});

GAMES.push({id:'trail',name:'وصّل الأرقام',cat:'الانتباه',c1:'#3CCBB9',c2:'#0E8C7E',
  how:'أرقام متفرقة على الشاشة. اضغط عليها بالترتيب ١، ٢، ٣... بأسرع ما تقدر. لوحتين.',
  play(ctx){
    const add=2*Math.floor((ctx.L-1)/2),boards=[12+add,16+add];let b=0,errs=0;const t0=performance.now();
    ctx.every(100,()=>ctx.info(((performance.now()-t0)/1000).toFixed(1)+'s'));
    const board=()=>{
      const n=boards[b];
      ctx.body.innerHTML=`<div class="ask">اللوحة ${b+1} من 2</div><div class="stage plain" style="height:420px"><svg width="100%" height="100%" style="position:absolute;inset:0"><polyline fill="none" stroke="#1FA99A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" points=""/></svg></div>`;
      const st=ctx.body.querySelector('.stage'),pl=st.querySelector('polyline');const W=st.clientWidth,H=st.clientHeight;
      const P=[];let tries=0;
      while(P.length<n&&tries<5000){tries++;const p={x:ri(30,W-30),y:ri(30,H-30)};if(P.every(q=>Math.hypot(q.x-p.x,q.y-p.y)>58))P.push(p)}
      let next=1;const pts=[];
      P.forEach((p,i)=>{const d=document.createElement('button');d.className='dotn';d.textContent=i+1;d.style.left=p.x+'px';d.style.top=p.y+'px';st.appendChild(d);
        tap(d,()=>{if(i+1===next){d.classList.add('done');tone(500+next*25,.08);pts.push(p.x+','+p.y);pl.setAttribute('points',pts.join(' '));next++;
            if(next>n){ctx.mark(true);b++;if(b<boards.length)ctx.after(600,board);else{const t=(performance.now()-t0)/1000+errs;ctx.after(500,()=>ctx.done({norm:clamp(Math.round((2.7-t/(boards[0]+boards[1]))/1.8*100),0,100),stat:`${t.toFixed(1)} ثانية • ${errs} غلط`}))}}}
          else if(!d.classList.contains('done')){errs++;snd(false);d.classList.add('err');setTimeout(()=>d.classList.remove('err'),300)}});
      });
    };
    board();
  }});

GAMES.push({id:'speed',name:'مطابقة سريعة',cat:'السرعة',c1:'#9F8BFF',c2:'#7C5CFA',
  how:'يطلع لك شكل. قرر بسرعة: هل هو نفس الشكل اللي قبله؟ اضغط «نعم» أو «لا». ٤٥ ثانية.',
  play(ctx){
    const L=ctx.L,rnd=()=>({s:ri(0,5),c:L>=4?SHAPE_COL[ri(0,5)]:null});const eqS=(a,b)=>a.s===b.s&&a.c===b.c;let prev=rnd(),cur,c=0,w=0,left=45,started=false;
    ctx.body.innerHTML=`<div class="ask">تذكّر هذا الشكل</div><div class="shapecard in">${shapeSvg(prev.s,prev.c)}</div><div class="yn"><button class="no">لا</button><button class="yes">نعم</button></div>`;
    const card=ctx.body.querySelector('.shapecard'),ask=ctx.body.querySelector('.ask');
    const yn=ctx.body.querySelector('.yn');yn.style.visibility='hidden';
    const btn=document.createElement('div');btn.style.cssText='width:100%;max-width:360px;margin-top:28px';btn.innerHTML='<button class="btn">التالي</button>';ctx.body.appendChild(btn);
    const show=()=>{const q=Math.random();cur=q<.45?{...prev}:(L>=4&&q<.75)?(Math.random()<.5?{s:prev.s,c:SHAPE_COL[(SHAPE_COL.indexOf(prev.c)+ri(1,5))%6]}:{s:(prev.s+ri(1,5))%6,c:prev.c}):rnd();card.classList.remove('in');void card.offsetWidth;card.classList.add('in');card.innerHTML=shapeSvg(cur.s,cur.c)};
    btn.querySelector('.btn').onclick=()=>{btn.remove();yn.style.visibility='visible';ask.textContent='نفس الشكل اللي قبله؟';show();started=true;
      ctx.info(left+'s');ctx.every(1000,()=>{left--;ctx.info(left+'s');if(left<=0)ctx.done({norm:clamp(Math.round((c-w)/40*100),0,100),stat:`${c} صح • ${w} غلط`})})};
    const answer=same=>{if(!started)return;const ok=same===eqS(cur,prev);ok?c++:w++;ctx.mark(ok);prev=cur;show()};
    tap(yn.querySelector('.yes'),()=>answer(true));tap(yn.querySelector('.no'),()=>answer(false));
  }});

GAMES.push({id:'stroop',name:'لون الحبر',cat:'المرونة',c1:'#FF8A8C',c2:'#E5484D',
  how:'تطلع لك كلمة لون مكتوبة بلون مختلف. اضغط على <b>لون الحبر</b> مو الكلمة نفسها! عندك ٤٥ ثانية.',
  play(ctx){
    const C=[{n:'أحمر',c:'#E5484D'},{n:'أزرق',c:'#2F6FEB'},{n:'أخضر',c:'#1F9D5C'},{n:'أصفر',c:'#E5B000'}];
    let c=0,w=0,ink,left=45;
    ctx.body.innerHTML=`<div class="word"></div><div class="cbtns"></div>`;
    const word=ctx.body.querySelector('.word'),bs=ctx.body.querySelector('.cbtns');
    const next=()=>{const wd=C[ri(0,3)];ink=Math.random()<.75?shuffle(C.filter(x=>x!==wd))[0]:wd;word.textContent=wd.n;word.style.color=ink.c};
    const L=ctx.L;
    const layout=()=>{bs.innerHTML='';const cs=shuffle([...C]);cs.forEach((col,i)=>{const b=document.createElement('button');b.textContent=col.n;
      if(L>=4)b.style.color=cs[(i+1)%4].c;
      tap(b,()=>{const ok=col===ink;ok?c++:w++;ctx.mark(ok);if(L>=7)layout();next()});bs.appendChild(b)})};
    layout();next();ctx.info(left+'s');
    ctx.every(1000,()=>{left--;ctx.info(left+'s');if(left<=0)ctx.done({norm:clamp(Math.round((c-w)/30*100),0,100),stat:`${c} صح • ${w} غلط`})});
  }});

const G=Object.fromEntries(GAMES.map(g=>[g.id,g]));

/* ================= brain age ================= */
function todaysTest(){
  let h=0;for(const ch of dayKey())h=(h*31+ch.charCodeAt(0))>>>0;
  const ids=GAMES.map(g=>g.id);
  for(let i=ids.length-1;i>0;i--){h=(h*1103515245+12345)>>>0;const j=h%(i+1);[ids[i],ids[j]]=[ids[j],ids[i]]}
  return ids.slice(0,3);
}
const ageFrom=avg=>clamp(Math.round(80-avg*.6),20,80);
function ageComment(a){
  if(a<=25)return'مخ شاب ونشيط!';if(a<=35)return'ممتاز، مخك بحالة قوية';
  if(a<=50)return'جيد! استمر بالتمرين اليومي';return'لا تشيل هم، التمرين اليومي يفرق كثير';
}
function startTest(){
  const ids=todaysTest();let i=0;const scores=[];
  const next=()=>{
    if(i===ids.length){
      const avg=scores.reduce((a,b)=>a+b,0)/scores.length,age=ageFrom(avg),d=dayKey();
      S.days[d]=S.days[d]||{played:[]};S.days[d].age=age;
      S.ages=S.ages.filter(x=>x.d!==d);S.ages.push({d,a:age});if(S.ages.length>90)S.ages.shift();save();
      return showAge(age);
    }
    const g=G[ids[i]];
    runGame(g,res=>{if(!res){render();return}record(g.id,res);levelUp(g.id,res.norm);scores.push(res.norm);i++;next()},`اختبار عمر المخ • ${i+1}/3`);
  };
  next();
}
function overlay(html){const el=document.createElement('div');el.className='game';el.innerHTML=`<div class="gbody"><div class="result">${html}</div></div>`;document.body.appendChild(el);return el}
function showAge(age){
  const el=overlay(`<div class="ring"><div class="c">${sv('0 0 64 64',70,ART.head)}</div></div><div class="lbl" style="font-size:20px">عمر مخك اليوم</div><div class="age">${age}</div><div class="lbl">سنة</div>
    <div class="stat">${ageComment(age)}</div><div class="btnrow"><button class="btn">تمام</button></div>`);
  tone(660);ctx2=setTimeout(()=>tone(990),150);el.querySelector('.btn').onclick=()=>{el.remove();tab='today';render()};
}
let ctx2;
function playSingle(id){
  const g=G[id];
  runGame(g,res=>{
    if(!res){render();return}
    const nb=record(id,res);res.note=levelUp(id,res.norm);
    const el=overlay(`${badge(g,84)}${nb?`<div class="newbest">${UI.trophy} رقم قياسي جديد!</div>`:''}<div class="lbl" style="font-size:20px">${g.name}</div>
      <div class="score">${res.norm}</div><div class="lbl">نقطة من 100</div><div class="stat">${res.stat}</div>${res.note?`<div class="newbest" style="background:#DDF3EF;color:#0E7A6E">${res.note}</div>`:''}
      <div class="btnrow"><button class="btn" data-a="again">العب مرة ثانية</button><button class="btn sec" data-a="back">رجوع</button></div>`);
    el.querySelector('[data-a=again]').onclick=()=>{el.remove();playSingle(id)};
    el.querySelector('[data-a=back]').onclick=()=>{el.remove();render()};
  });
}

/* ================= screens ================= */
let tab='today';
function gameRow(g){
  const b=S.best[g.id];
  return `<button class="grow" data-play="${g.id}">${badge(g,52)}<div style="flex:1"><b>${g.name}</b><small>${g.cat} • مستوى ${lvl(g.id)}</small></div>${b?`<div class="best">${b.norm}<br><small>أفضل</small></div>`:`<div class="best" style="color:var(--acc);font-size:15px">ابدأ ▸</div>`}</button>`;
}
function topBar(){
  const last=S.ages.length?S.ages[S.ages.length-1].a:'--';
  return `<div class="top"><div class="brand">${sv('0 0 24 24',24,'<path d="M8.5 19v-2.2A5 5 0 1 1 12 7.2 4 4 0 0 1 18.3 10 3.2 3.2 0 0 1 17 16.1V19z" fill="none" stroke="#0E7C6E" stroke-width="2" stroke-linejoin="round"/><path d="M12 8.2v7.6M12 11h2.2M12 13.8H9.9" stroke="#0E7C6E" stroke-width="1.6" stroke-linecap="round"/>')}<span>تمرين المخ</span></div><div class="pill">${UI.flame} ${streak()}</div><div class="pill">${UI.gauge} ${last} <small>عمر المخ</small></div></div>`;
}
function renderToday(){
  const d=dayKey(),td=S.days[d],ids=todaysTest(),done=td&&td.age;
  const doneCount=td?td.played.length:0;
  let week='';for(let o=-6;o<=0;o++){const k=dayKey(o);const dt=new Date();dt.setDate(dt.getDate()+o);
    week+=`<div class="day"><div class="stamp ${S.days[k]?'on':''} ${o===0?'today':''}">${S.days[k]?UI.check:''}</div>${AR_DAYS[dt.getDay()]}</div>`}
  return `${topBar()}<div class="h1">هلا والله</div><div class="sub">تمرين بسيط كل يوم يحافظ على مخك نشيط</div>
  <div class="card hero center">
    <div class="ring"><div class="c">${done?`<b>${td.age}</b><span>عمر مخك اليوم</span>`:sv('0 0 64 64',70,ART.head)}</div></div>
    <h3>${done?'خلصت اختبار اليوم':'اختبر عمر مخك'}</h3>
    <p>${done?'تقدر تعيده، أو تكمل باقي التمارين.':'٣ تمارين قصيرة تتغير كل يوم، وتعطيك عمر مخك.'}</p>
    <div class="glist" style="margin-bottom:20px;text-align:right">${ids.map(id=>gameRow(G[id])).join('')}</div>
    <button class="btn" id="startTest">${done?'أعد الاختبار':'ابدأ الاختبار'}</button>
  </div>
  <div class="cat">كل التمارين</div>
  <div class="gwrap glist" style="margin-bottom:6px">${GAMES.map(g=>gameRow(g)).join('')}</div>
  <div class="card"><h3>ختم الأسبوع</h3><p>العب أي تمرين كل يوم عشان تاخذ ختم وتكبر الستريك</p><div class="week">${week}</div>
  <div class="dots">${GAMES.map((g,i)=>`<i class="${i<doneCount?'on':''}"></i>`).join('')}</div>
  <div class="center" style="color:var(--muted);font-weight:700;font-size:14px">${doneCount} من ${GAMES.length} تمارين اليوم</div></div>`;
}
function renderGames(){
  const cats=[...new Set(GAMES.map(g=>g.cat))];
  return `${topBar()}<div class="h1">التمارين</div><div class="sub">${GAMES.length} تمارين، اختار أي واحد والعب بحرية</div>
  ${cats.map(c=>`<div class="cat">${c}</div><div class="gwrap glist">${GAMES.filter(g=>g.cat===c).map(g=>gameRow(g)).join('')}</div>`).join('')}`;
}
function ageChart(){
  const pts=S.ages.slice(-14);
  if(pts.length<2)return`<p>سوّ اختبار عمر المخ يومين على الأقل عشان يطلع لك الرسم</p>`;
  const W=420,H=180,px=30,py=20;const x=i=>px+i*(W-2*px)/(pts.length-1);const y=a=>py+(a-20)/60*(H-2*py);
  const path=pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.a).toFixed(1)}`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="direction:ltr">
    ${[20,40,60,80].map(a=>`<line x1="${px}" x2="${W-px}" y1="${y(a)}" y2="${y(a)}" stroke="#EEE8DE"/><text x="4" y="${y(a)+4}" font-size="11" fill="#9CA3AF">${a}</text>`).join('')}
    <path d="${path}" fill="none" stroke="#0E7C6E" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.a)}" r="4.5" fill="#fff" stroke="#0E7C6E" stroke-width="2.5"/>`).join('')}
  </svg><div style="color:var(--muted);font-size:13px;text-align:center">كل ما نزل الخط = مخك أصغر</div>`;
}
function renderBrain(){
  const totalDays=Object.keys(S.days).length;
  return `${topBar()}<div class="h1">مخّي</div><div class="sub">${totalDays} يوم تمرين • الستريك الحالي ${streak()}</div>
  <div class="card"><h3>عمر المخ عبر الأيام</h3>${ageChart()}</div>
  <div class="card"><h3>أفضل نتايجك</h3><div class="glist">
  ${GAMES.map(g=>{const b=S.best[g.id];return`<div style="display:flex;gap:12px;align-items:center">${badge(g,40)}<div style="flex:1"><div style="display:flex;justify-content:space-between;font-weight:800"><span>${g.name}</span><span>${b?b.norm:'—'}</span></div>
    <div class="bar"><i style="width:${b?b.norm:0}%"></i></div>${b?`<small style="color:var(--muted);font-weight:700">${b.stat}</small>`:''}</div></div>`}).join('')}
  </div></div>
  <div class="card"><button class="btn sec" id="reset">مسح كل البيانات</button></div>`;
}
const NAV=[['today','اليوم',UI.navToday],['games','التمارين',UI.navGames],['brain','مخّي',UI.navBrain]];
$('.nav').innerHTML=NAV.map(([k,l,i])=>`<button data-tab="${k}">${i}${l}</button>`).join('');
function render(){
  const app=$('#app');
  app.innerHTML=tab==='today'?renderToday():tab==='games'?renderGames():renderBrain();
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  app.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>playSingle(b.dataset.play));
  const st=$('#startTest');if(st)st.onclick=startTest;
  const rs=$('#reset');if(rs)rs.onclick=()=>{
    if(rs.dataset.sure){S={days:{},best:{},hist:{},ages:[]};save();render()}
    else{rs.dataset.sure=1;rs.textContent='متأكد؟ اضغط مرة ثانية';rs.style.background='#FCDCDD'}};
  window.scrollTo(0,0);
}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
render();
</script>
</body>
